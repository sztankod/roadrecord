name: RoadRecord build and Nethely deploy
# A master az alapértelmezett ág; a workflow kézzel és verziótaggal is indítható.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Forráskód letöltése
        uses: actions/checkout@v5

      - name: JDK 17 beállítása
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle jogosultság
        run: chmod +x gradlew

      - name: Állandó APK-aláírókulcs előkészítése
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ROADRECORD_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/roadrecord-signing.jks"

      - name: Telepíthető APK készítése
        env:
          ROADRECORD_KEYSTORE: ${{ runner.temp }}/roadrecord-signing.jks
          ROADRECORD_STORE_PASSWORD: ${{ secrets.ROADRECORD_STORE_PASSWORD }}
          ROADRECORD_KEY_ALIAS: ${{ secrets.ROADRECORD_KEY_ALIAS }}
          ROADRECORD_KEY_PASSWORD: ${{ secrets.ROADRECORD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verzió és letöltőfájlok előkészítése
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="1.02"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk download-site/apk/roadrecord-latest.apk
          cp app/build/outputs/apk/debug/app-debug.apk "download-site/apk/roadrecord-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: APK hozzáadása a GitHub kiadáshoz
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            download-site/apk/roadrecord-latest.apk
            download-site/apk/roadrecord-v${{ env.VERSION }}.apk

      - name: Feltöltés a Nethely roadrecord mappájába
        env:
          FTP_SERVER: ${{ secrets.NETHELY_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.NETHELY_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.NETHELY_FTP_PASSWORD }}
        shell: bash
        run: |
          test -n "$FTP_SERVER" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          find download-site -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#download-site/}"
            curl --fail --silent --show-error --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://${FTP_SERVER}/${relative}"
          done

      - name: GitHub Pages csomag előkészítése
        uses: actions/upload-pages-artifact@v4
        with:
          path: download-site

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikálás GitHub Pages-re
        id: deployment
        uses: actions/deploy-pages@v4
