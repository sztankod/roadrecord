<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0D2B60">
  <title>RoadRecord letöltés</title>
  <link rel="canonical" href="http://roadrecord.widor.nhely.hu/">
  <link rel="icon" href="roadrecord-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="download-card">
    <img class="logo" src="roadrecord-logo.png" alt="RoadRecord logó">
    <h1>RoadRecord</h1>
    <div class="release-info" aria-live="polite">
      <span id="version">v1.55</span>
      <span class="separator" aria-hidden="true"></span>
      <time id="release-date">2026. november 6.</time>
    </div>
    <a id="download" class="download-button" href="apk/roadrecord-v1.55.apk" download="roadrecord-v1.55.apk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1ZM5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
      <span>Alkalmazás letöltése</span>
    </a>
  </main>
  <script>
    fetch('version.json', {cache: 'no-store'})
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(release => {
        const version = String(release.versionName || '1.55');
        const url = release.apkUrl || `apk/roadrecord-v${version}.apk`;
        const link = document.getElementById('download');
        document.getElementById('version').textContent = `v${version}`;
        link.href = url;
        link.download = `roadrecord-v${version}.apk`;
        if (release.releaseDate) {
          const date = new Date(`${release.releaseDate}T12:00:00`);
          document.getElementById('release-date').textContent = new Intl.DateTimeFormat('hu-HU', {
            year: 'numeric', month: 'long', day: 'numeric'
          }).format(date);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
