<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0D2B60">
  <title>RoadRecord letöltés</title>
  <link rel="canonical" href="http://roadrecord.widor.nhely.hu/">
  <link rel="icon" href="roadrecord-logo.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="download-card">
    <img class="logo" src="roadrecord-logo.png" alt="RoadRecord logó">
    <h1>RoadRecord</h1>
    <div class="release-info" aria-live="polite">
      <div class="release-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 9 5-9 5-9-5 9-5Zm-5.8 5L12 10.22 17.8 7 12 3.78 6.2 7Zm-3.08 4.13a1 1 0 0 1 1.36-.38L12 14.93l7.52-4.18a1 1 0 1 1 .96 1.75L12 17.2 3.52 12.5a1 1 0 0 1-.4-1.37Zm0 4a1 1 0 0 1 1.36-.38L12 18.93l7.52-4.18a1 1 0 1 1 .96 1.75L12 21.2 3.52 16.5a1 1 0 0 1-.4-1.37Z"/></svg>
        <span>Verzió: <strong id="version">1.56</strong></span>
      </div>
      <span class="separator" aria-hidden="true"></span>
      <div class="release-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm12 8H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1ZM5 6a1 1 0 0 0-1 1v1h16V7a1 1 0 0 0-1-1H5Z"/></svg>
        <span>Kiadás: <time id="release-date">2026.11.07.</time></span>
      </div>
    </div>
    <a id="download" class="download-button" href="apk/roadrecord-v1.63.apk" download="roadrecord-v1.63.apk">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1ZM5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1Z"/></svg>
      <span>APK letöltése</span>
    </a>
  </main>
  <script>
    fetch('version.json', {cache: 'no-store'})
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(release => {
        const version = String(release.versionName || '1.56');
        const url = release.apkUrl || `apk/roadrecord-v${version}.apk`;
        const link = document.getElementById('download');
        document.getElementById('version').textContent = version;
        link.href = url;
        link.download = `roadrecord-v${version}.apk`;
        if (release.releaseDate) {
          const date = new Date(`${release.releaseDate}T12:00:00`);
          document.getElementById('release-date').textContent = new Intl.DateTimeFormat('hu-HU', {
            year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(date);
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
