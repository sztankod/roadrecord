<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="theme-color" content="#0b2d5c">
  <title>RoadRecord adminisztráció</title>
  <link rel="icon" href="../roadrecord-logo.png" type="image/png">
  <link rel="stylesheet" href="admin.css?v=20261119-3">
  <link rel="stylesheet" href="admin-extra.css?v=20261119-3">
  <link rel="stylesheet" href="live.css?v=20261119-3">
  <link rel="stylesheet" href="admin-modern.css?v=20261119-3">
</head>
<body>
  <main>
    <section id="login" class="login-card">
      <img src="../roadrecord-logo.png" alt="RoadRecord logó">
      <h1>RoadRecord Admin</h1>
      <p>Válaszd ki a belépés módját.</p>
      <div class="login-methods"><button id="login-method-code" type="button" class="active">Ellenőrzőkód</button><button id="login-method-password" type="button">Jelszó</button></div>
      <div id="code-login">
        <label>E-mail-cím<input id="email" type="email" value="sztankod@gmail.com"></label>
        <button id="request-code" type="button" class="primary">Ellenőrzőkód küldése</button>
        <div id="code-area" hidden>
          <label>Ellenőrzőkód<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
          <button id="verify-code" class="primary">Belépés</button>
        </div>
      </div>
      <div id="password-login" hidden>
        <label>E-mail-cím<input id="password-email" type="email" autocomplete="username"></label>
        <label>Jelszó<input id="password" type="password" autocomplete="current-password"></label>
        <button id="password-login-button" class="primary">Belépés jelszóval</button>
      </div>
      <p id="login-message" class="message"></p>
    </section>

    <section id="dashboard" hidden>
      <header class="topbar">
        <div class="brand"><img src="roadrecord-mark-white.png" alt="RoadRecord"><div><strong>RoadRecord</strong><span>Adminisztráció</span></div></div>
        <div class="top-actions"><span class="notification" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i></i></span><button id="logout" class="ghost"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg> Kilépés</button></div>
      </header>
      <div class="summary-grid">
        <article><i><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></i><span>Felhasználók</span><strong id="user-count">0</strong></article>
        <article><i><svg viewBox="0 0 24 24"><path d="M12 2 3 7l9 5 9-5-9-5zM3 12l9 5 9-5M3 17l9 5 9-5"/></svg></i><span>Aktív készülékek</span><strong id="device-count">0</strong></article>
        <article><i><svg viewBox="0 0 24 24"><path d="M6 2v3M18 2v3M3 9h18M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2z"/></svg></i><span>Utolsó szinkron</span><strong id="last-sync">–</strong></article>
      </div>
      <div class="layout">
        <aside>
          <nav class="admin-nav">
          <button id="central-stops" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><strong>Központi megállótár</strong><small id="central-stop-count">Megnyitás</small></button>
          <button id="delivery-reports" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM15 2v6h5M9 12h8M9 16h8"/></svg></span><strong>Szállítólevél riport</strong><small>Beállítások</small></button>
          <button id="delivery-notes" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M2 7h13v10H2zM15 11h4l3 3v3h-7zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4M18 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/></svg></span><strong>Szállítólevelek begyűjtése</strong><small>Napi összesítő</small></button>
          <button id="delivery-summary" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM15 2v6h5M9 12h8M9 16h8"/></svg></span><strong>Szállítólevél leltár</strong><small>Teljesítési dátumok</small></button>
          <div class="aside-section-label">Felhasználók</div>
          <button id="admin-accounts" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></span><strong>Felhasználók</strong><small>Admin és guest</small></button>
          <button id="admin-login-log" class="central-stops-button"><span><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9M12 7v5l3 2M17 3h4v4M21 3l-5 5"/></svg></span><strong>Belépési napló</strong><small>Admin belépések</small></button>
          </nav>
          <div class="aside-head"><h2>Alkalmazás-felhasználók</h2><button id="refresh" title="Frissítés">↻</button></div>
          <input id="search" type="search" placeholder="Keresés e-mail alapján">
          <div id="users" class="user-list"></div>
        </aside>
        <section id="detail" class="detail empty"><p>Válassz egy felhasználót a részletek megnyitásához.</p></section>
      </div>
    </section>
  </main>
  <script src="admin.js?v=20261120-2"></script>
</body>
</html>
